# 13회 빅분기 실기 고사장 접수 현황(마감 / 잔여 좌석)을 가져와 venue-status.json 으로 이 저장소 main에 커밋한다.
# - GitHub 클라우드에서 돈다(사장님 컴퓨터가 꺼져 있어도 됨). 코딩팡은 재배포하지 않고 화면이 이 파일을 바로 읽는다.
# - 한 번 실행이 약 5시간 40분 동안 10분마다(:00 :10 …) 갱신하고, 끝나기 전에 다음 실행을 띄워 이어 간다.
#   (예약 실행이 새 저장소에서 제때 안 깨어나서 10/26에 이 방식으로 바꿈) 매시 3분 예약은 끊겼을 때 다시 잇는 예비.
# - 접수 마감(10/30 18:00) 직후 10/30 18:05에 멈춘다.
name: 고사장 접수 현황

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      DEADLINE: "2026-10-30 18:05"
    steps:
      - name: 일정 확인 (마감 지났거나, 예약 실행인데 이미 도는 게 있으면 건너뜀)
        id: guard
        run: |
          run=true
          if [[ "$(date '+%Y-%m-%d %H:%M')" > "$DEADLINE" ]]; then run=false; echo "접수 기간이 끝났어요"; fi
          if [ "$run" = true ] && [ "${{ github.event_name }}" = "schedule" ]; then
            busy=$(gh run list -R "${{ github.repository }}" -w venue-status.yml -s in_progress --json databaseId -q "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
            if [ "$busy" != "0" ]; then run=false; echo "이미 갱신 중"; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 24

      - name: 10분마다 갱신 (끝나기 전에 다음 실행 띄우기)
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DL=$(date -d "$DEADLINE" +%s)
          END=$(( $(date +%s) + 340*60 )); [ $END -gt $DL ] && END=$DL
          handed=0
          while [ $(date +%s) -lt $END ]; do
            git pull -q --rebase origin main || true
            if node venue-status.mjs; then
              git add venue-status.json
              if ! git diff --cached --quiet; then
                git commit -qm "고사장 접수 현황 $(date +%H:%M) 갱신" -- venue-status.json
                for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
              fi
            fi
            # 끝나기 15분 전, 마감 전이면 다음 실행을 띄운다 (몇 분 겹쳐도 같은 파일이라 괜찮다)
            if [ $handed = 0 ] && [ $(( END - $(date +%s) )) -lt 900 ] && [ $END -lt $DL ]; then
              gh workflow run venue-status.yml -R "${{ github.repository }}" && handed=1 && echo "다음 실행 띄움"
            fi
            now=$(date +%s); next=$(( (now / 600 + 1) * 600 ))
            [ $next -gt $END ] && break
            sleep $(( next - now ))
          done
